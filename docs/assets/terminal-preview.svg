<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title description">
  <title id="title">sj — queue, logs, scripts, and job shells</title>
  <desc id="description">An illustrative terminal session with an adaptive Slurm queue, a job log, the submitted script in less, and a shell menu. The first running container is selected and the host shell is last.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#090f1c"/>
    </linearGradient>
  </defs>
  <style>
    svg { fill: #e2e8f0; font-size: 14px; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #8fa2bd; }
    .cyan { fill: #67e8f9; }
    .green { fill: #6ee7b7; }
    .amber { fill: #fcd34d; }
    .small { font-size: 12px; }
    .label { font-size: 11px; letter-spacing: 1px; }
    .panel { fill: #101b2e; stroke: #293751; stroke-width: 1; }
  </style>

  <rect x="1" y="1" width="1098" height="848" rx="24" fill="url(#background)" stroke="#293751"/>
  <text x="34" y="61" font-size="31" font-weight="700" class="cyan">sj</text>
  <text x="91" y="59" font-size="15" class="muted">Slurm, a few keystrokes away.</text>
  <rect x="810" y="33" width="261" height="31" rx="15" fill="#20283f"/>
  <text x="941" y="53" text-anchor="middle" class="label" fill="#c4b5fd">QUEUE / LOGS / SCRIPTS / SHELLS</text>

  <rect x="28" y="91" width="1044" height="236" rx="14" class="panel"/>
  <path d="M42 91 H1058 Q1072 91 1072 105 V131 H28 V105 Q28 91 42 91Z" fill="#17233a"/>
  <circle cx="50" cy="111" r="4" fill="#fb7185"/>
  <circle cx="67" cy="111" r="4" fill="#fbbf24"/>
  <circle cx="84" cy="111" r="4" fill="#34d399"/>
  <text x="108" y="116" class="cyan">$ sj --me</text>
  <text x="1048" y="116" text-anchor="end" class="muted small">q / adaptive queue</text>

  <g class="muted" font-weight="600">
    <text x="52" y="160">JOBID</text>
    <text x="120" y="160">PARTITION</text>
    <text x="238" y="160">NAME</text>
    <text x="430" y="160">USER</text>
    <text x="506" y="160">ST</text>
    <text x="548" y="160">TIME_LEFT</text>
    <text x="665" y="160">TIME</text>
    <text x="764" y="160">NODES</text>
    <text x="840" y="160">NODELIST(REASON)</text>
  </g>
  <g>
    <text x="52" y="193">12345</text>
    <text x="120" y="193" class="muted">compute</text>
    <text x="238" y="193">pretrain-8k</text>
    <text x="430" y="193" class="muted">${USER}</text>
    <text x="506" y="193" class="green">R</text>
    <text x="548" y="193" class="cyan">0:35:54</text>
    <text x="665" y="193">1:24:06</text>
    <text x="764" y="193">8</text>
    <text x="840" y="193" class="cyan">node-[01-08]</text>

    <text x="52" y="225">12346</text>
    <text x="120" y="225" class="muted">compute</text>
    <text x="238" y="225">eval-checkpoint</text>
    <text x="430" y="225" class="muted">${USER}</text>
    <text x="506" y="225" class="green">R</text>
    <text x="548" y="225" class="cyan">3:56:19</text>
    <text x="665" y="225">0:03:41</text>
    <text x="764" y="225">1</text>
    <text x="840" y="225" class="cyan">node-009</text>

    <text x="52" y="257">12347</text>
    <text x="120" y="257" class="muted">compute</text>
    <text x="238" y="257">sweep-lr</text>
    <text x="430" y="257" class="muted">${USER}</text>
    <text x="506" y="257" class="amber">PD</text>
    <text x="548" y="257" class="cyan">2-00:00:00</text>
    <text x="665" y="257">0:00</text>
    <text x="764" y="257">4</text>
    <text x="840" y="257" class="amber">(Priority)</text>
  </g>
  <path d="M52 280 H1048" stroke="#293751"/>
  <text x="52" y="305" class="muted small">Runtime left at a glance. More room for names. Columns that fit.</text>

  <rect x="28" y="349" width="510" height="226" rx="14" class="panel"/>
  <path d="M42 349 H524 Q538 349 538 363 V389 H28 V363 Q28 349 42 349Z" fill="#17233a"/>
  <text x="52" y="375" class="cyan">$ sj out 12345</text>
  <text x="514" y="375" text-anchor="end" class="muted small">out / job log</text>
  <text x="52" y="417" class="muted small">sj: /shared/logs/slurm-12345.out</text>
  <text x="52" y="445" class="small">[12:08:15] loading checkpoint</text>
  <text x="52" y="468" class="small green">[12:08:18] evaluation started</text>
  <text x="52" y="491" class="small">[12:09:03] step 128 complete</text>
  <rect x="52" y="532" width="122" height="25" rx="5" fill="#123a35"/>
  <text x="113" y="549" text-anchor="middle" class="small green">F to follow</text>
  <text x="194" y="549" class="muted small">less -R +G</text>

  <rect x="558" y="349" width="514" height="226" rx="14" class="panel"/>
  <path d="M572 349 H1058 Q1072 349 1072 363 V389 H558 V363 Q558 349 572 349Z" fill="#17233a"/>
  <text x="582" y="375" class="cyan">$ sj script 12345</text>
  <text x="1048" y="375" text-anchor="end" class="muted small">script / submitted copy</text>
  <text x="582" y="417" class="small muted">1  #!/bin/bash</text>
  <text x="582" y="445" class="small cyan">2  #SBATCH --job-name=train-demo</text>
  <text x="582" y="468" class="small cyan">3  #SBATCH --partition=compute</text>
  <text x="582" y="491" class="small">4  srun ./run-job.sh</text>
  <rect x="582" y="532" width="153" height="25" rx="5" fill="#20283f"/>
  <text x="658" y="549" text-anchor="middle" class="small" fill="#c4b5fd">Submitted snapshot</text>
  <text x="755" y="549" class="muted small">less -N +g</text>

  <rect x="28" y="597" width="1044" height="181" rx="14" class="panel"/>
  <path d="M42 597 H1058 Q1072 597 1072 611 V637 H28 V611 Q28 597 42 597Z" fill="#17233a"/>
  <text x="52" y="623" class="cyan">$ sj sh 12345 0</text>
  <text x="1048" y="623" text-anchor="end" class="muted small">sh / shell picker</text>
  <text x="52" y="665" class="muted small">Select shell | job 12345</text>
  <rect x="46" y="678" width="505" height="32" rx="5" fill="#342854" stroke="#6d55a2"/>
  <text x="54" y="699" font-size="13" fill="#ede9fe">&gt;     0 container-demo (PID 23456)</text>
  <text x="54" y="737" font-size="13" class="muted">      1 host shell</text>
  <text x="590" y="699" class="muted small">The first container is selected.</text>
  <text x="590" y="737" class="muted small">↑↓ move · digits + Enter · q/Esc cancel</text>

  <text x="550" y="823" text-anchor="middle" class="muted small">One executable. Four everyday Slurm tasks.</text>
</svg>
