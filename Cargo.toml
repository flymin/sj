[package]
name = "sj"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Small Slurm job helpers: queue, output, scripts, and node/container shells"
license = "MIT"

[dependencies]
glob = "0.3"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
