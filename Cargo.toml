[package]
name = "sj"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Small Slurm job helpers: queue, output, scripts, and node/container shells"
license = "MIT"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"] }
glob = "0.3"
libc = "0.2"
regex = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-width = "0.2"
unicode-segmentation = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
